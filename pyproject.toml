[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flymagotchi"
version = "0.1.0"
description = "A desktop pet fly driven by a FlyWire-derived LIF neural circuit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
ui = ["PyQt6>=6.5"]
dev = ["pytest>=7.0"]
data = ["caveclient>=5.0"]

[project.scripts]
flymagotchi = "flymagotchi.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
